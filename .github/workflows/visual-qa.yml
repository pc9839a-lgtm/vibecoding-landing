name: Visual QA & Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - scripts/visual-qa.mjs
      - .github/workflows/visual-qa.yml

permissions:
  contents: write

concurrency:
  group: vibecoding-visual-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect full landing at mobile and desktop widths
        run: node scripts/visual-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-page-screenshots
          path: review/
          if-no-files-found: warn
      - name: Publish reviewed screenshots in repository
        if: success()
        run: |
          git config user.name "vibe-landing-qa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/mobile-360.jpg review/mobile-390.jpg review/desktop-1440.jpg review/qa-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified full-page screenshots for mobile and desktop"
            git push
          fi
