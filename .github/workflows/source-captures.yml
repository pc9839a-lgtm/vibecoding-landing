name: Verified live project screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-real-sites.mjs
      - .github/workflows/source-captures.yml
permissions:
  contents: write
concurrency:
  group: vibecoding-project-screenshots
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real pages
        run: node scripts/capture-real-sites.mjs
      - name: Upload verified captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-public-project-screens
          path: assets/cases/
          if-no-files-found: warn
      - name: Save snapshots to repository
        if: success()
        run: |
          git config user.name "vibecoding-project-review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cases/
          if ! git diff --cached --quiet; then
            git commit -m "Add captured real PageRo, Cruise, Awards, PEOPLEENT public screens"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
